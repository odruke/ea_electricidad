name: ea-electricidad

services:
  # Static site with its own headers, redirects and localized 404 (Caddyfile.web).
  # No host port: the shared VPS reverse proxy (a separate project) reaches it on the
  # external `proxy` network as `ea-electricidad-web:8080` and only terminates TLS.
  # `app` stays private to this project, for a future backend.
  web:
    image: ea-electricidad-web:local
    build:
      context: .
      target: web
      args:
        SITE_URL: ${SITE_URL:?SITE_URL is required (see .env.example)}
        SITE_ENV: ${SITE_ENV:-staging}
    restart: unless-stopped
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      app: {}

      proxy:
        aliases:
          - ea-electricidad-web
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  app:
    driver: bridge

  proxy:
    external: true
    name: proxy
